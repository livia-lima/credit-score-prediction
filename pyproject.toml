[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "credit_score_prediction"
version = "0.0.1"
description = "Credit risk analysis and predictive modeling case study."
authors = [
  { name = "Livia Lima" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["credit_score_prediction"]
include = ["pyproject.toml", "credit_score_prediction/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["credit_score_prediction"]
force-sort-within-sections = true

